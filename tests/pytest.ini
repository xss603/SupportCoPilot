[pytest]
testpaths = .
pythonpath = .. ../backend
asyncio_default_fixture_loop_scope = function
addopts = -ra -q --strict-markers
markers =
    mocks: Local mock/stub server verification tests
    smoke: Fast smoke checks for test infrastructure and mock servers
    tier1: Tier 1 per-feature functional tests
    tier2: Tier 2 boundary and corner-case tests
    tier3: Tier 3 cross-feature pairwise tests
    eval: RAG grounding and abstention evaluation tests
    integration: Backend and mock cluster integration tests
    slow: Long-running tests (e.g. multi-second timeouts or full workflows)
