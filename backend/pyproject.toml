[project]
name = "gitlab-support-platform-backend"
version = "1.0.0"
description = "Event-Driven GitLab Support Automation & Documentation Triage Platform Backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
